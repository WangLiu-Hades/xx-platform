# Maven Wrapper 配置
#
# 说明（重要）：
# 本目录下没有 maven-wrapper.jar —— 官方 `mvn wrapper:wrapper` 生成的 jar 属于二进制产物，
# 当前开发环境离线（无法访问 Maven Central）也不宜把二进制塞进仓库。
# 因此这里的 mvnw / mvnw.cmd 是**轻量等价实现**，保留 wrapper 的核心价值：
#   1) 团队成员不必各自手装 Maven，用 ./mvnw 即可；
#   2) 版本由本文件固定，避免"你 3.8、我 3.9"导致构建差异；
#   3) CI 也可以用同一入口。
# 行为差异：本机没有 Maven 时会自动下载 distributionUrl 指定的发行版到
#   wrapper/dists 目录（首次需联网），之后复用；已装 Maven 时直接复用本机版本。
#
# 如需换成官方 wrapper（需要联网一次）：
#   mvn -N wrapper:wrapper -Dmaven=3.9.16
# 之后把本文件保留即可——官方 mvnw 同样读取这里的 distributionUrl。

distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
# 本机已装 Maven 时也强制使用下面这个版本（留空表示"用本机已装的任意版本"）
mavenVersion=3.9.16
