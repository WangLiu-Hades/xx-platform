<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多维数据分析平台 系统设计交互原型</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#162b3d;background:#f5f7fa;--blue:#1769aa;--line:#d9e1ea;--muted:#5e6d7c}
    *{box-sizing:border-box}body{margin:0}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eaf3fa,#f8fafc)}
    .login-card{width:min(420px,92vw);padding:32px;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #163b6020}
    h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0 0 10px}.hint{color:var(--muted);font-size:12px}.login-card label{display:block;margin-top:16px}
    input,select{height:38px;border:1px solid #b9c7d4;border-radius:6px;padding:0 10px;background:white;color:#162b3d;min-width:120px}
    input[type=checkbox]{height:auto;min-width:auto}.login-card input{width:100%;margin-top:6px}.shell{display:none;min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .body{display:flex;min-height:calc(100vh - 64px)}.side{width:224px;height:calc(100vh - 64px);position:sticky;top:0;overflow:auto;flex-shrink:0;background:#102f4c;padding:16px 8px;color:#eaf4ff}.side button{display:block;width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}.side button:hover,.side button.active{background:#245a87}
    main{padding:24px;flex:1;min-width:0;max-width:1660px}.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.metric{font-size:24px;font-weight:700;margin-top:8px}.meta{font-size:12px;color:var(--muted)}
    button{font:inherit}.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;color:#183b55}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.danger{color:#b42332}.toolbar{margin-bottom:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 10px;font-size:13px}th{background:#f3f7fa}.tag{border-radius:20px;padding:4px 9px;font-size:12px;background:#e4f4eb;color:#147d52}.tag.warn{background:#fff0d7;color:#9b5d00}.tag.fail{background:#fde8ea;color:#b42332}.map{height:420px;border:1px solid #bed1e0;border-radius:8px;background:linear-gradient(45deg,#e4f0e8 25%,transparent 25%),linear-gradient(-45deg,#e4f0e8 25%,transparent 25%),#d7e8e9;background-size:80px 80px;position:relative;overflow:hidden}.map::before{content:"地图示意 · Mock 点位 · 当前视窗查询";position:absolute;left:16px;top:16px;background:#ffffffd9;padding:8px;border-radius:5px;font-size:12px}.dot{position:absolute;border:0;border-radius:50%;background:#1769aa;color:white;width:30px;height:30px;cursor:pointer}.dot.selected{outline:4px solid #e8b14c}.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:16px}.chart{height:180px;background:repeating-linear-gradient(to right,#fff,#fff 39px,#eaf0f5 40px),repeating-linear-gradient(to top,transparent,transparent 39px,#eaf0f5 40px);border:1px solid var(--line);display:flex;align-items:end;padding:10px;gap:8px}.bar{flex:1;background:#5d9dcc;min-height:20px}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.portrait{height:150px;border-radius:6px;background:linear-gradient(135deg,#dce7ed,#b5cdda);display:grid;place-items:center;color:#456;font-size:36px}.notice{padding:10px 12px;border-radius:6px;background:#fff6e8;color:#8d5b08;font-size:13px}.empty{padding:46px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}.panel{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fafcfe}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{margin-top:24px;color:var(--muted);font-size:12px}.hide{display:none!important}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.side{width:180px}.gallery{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <section id="login" class="login"><div class="login-card"><h1>多维数据分析平台</h1><p class="hint">系统设计交互原型 · 所有数据均为 Mock</p><label>登录账号<input value="demo.user" aria-label="登录账号"></label><label>密码<input type="password" value="mock-password" aria-label="密码"></label><p><button class="btn primary" onclick="enter()">登录并查看原型</button></p><p class="hint">演示不会发送凭据，也不连接后台。</p></div></section>
  <section id="shell" class="shell"><header class="top"><strong>多维数据分析平台 <span class="hint">设计原型</span></strong><div class="row"><span class="hint">Mock 用户 · 数据范围示意</span><button class="btn" onclick="show('任务中心')">任务中心</button><button class="btn" onclick="logout()">退出</button></div></header><div class="body"><aside class="side" id="side"></aside><main><div id="crumb" class="crumb"></div><div id="view"></div><div class="footer">仅验证页面树、导航和交互状态；数值、位置及身份信息均为虚构示意。</div></main></div></section>
  <script>
  const groups={"系统首页":["系统首页"],"数据检索":["围栏检索","车牌检索","MAC检索","人像检索","人员库"],"综合分析":["地图研判"],"数据研判":["伴随任务","碰撞任务","区域统计","数据运算"],"布控预警":["综合布控","告警结果"],"数据模型":["图码档案","车码档案","数据态势"],"运维服务":["运维首页","场所管理","设备管理","设备分布","参数配置","运维报表","运维通知"],"系统设置":["用户管理","角色管理","操作日志","短信日志"],"共享入口":["任务中心"]};
  let active="系统首页",mode="data",chosen="";
  function enter(){document.getElementById('login').style.display='none';document.getElementById('shell').style.display='block';show(active)}
  function logout(){document.getElementById('shell').style.display='none';document.getElementById('login').style.display='grid'}
  function nav(){document.getElementById('side').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="hint" style="color:#9dc1df;margin:12px 12px 4px">${g}</div>${items.map(x=>`<button class="${x===active?'active':''}" onclick="show('${x}')">${x}</button>`).join('')}`).join('')}
  function show(name){active=name;mode='data';nav();document.getElementById('crumb').textContent=Object.entries(groups).find(([g,a])=>a.includes(name))?.[0]+' / '+name;render()}
  function state(s){mode=s;render()}
  function demoStates(){return `<div class="row toolbar"><span class="hint">页面状态预览</span>${['data','loading','empty','error','permission','partial','offline'].map(s=>`<button class="btn" onclick="state('${s}')">${({data:'正常',loading:'加载',empty:'空结果',error:'失败/超时',permission:'无权限',partial:'部分失败',offline:'离线'})[s]}</button>`).join('')}</div>`}
  function stateBox(){if(mode==='data')return '';return `<div class="card empty">${({loading:'正在加载当前区域…',empty:'当前条件下无结果，可重置筛选。',error:'请求失败或超时 · TraceId mock-trace-001 · 可重试',permission:'无权限查看此数据；后端仍会强制校验。',partial:'部分指标加载失败；其余内容继续展示。',offline:'连接或设备离线；显示上次更新时间。'})[mode]} <button class="btn" onclick="state('data')">恢复正常</button></div>`}
  function controls(fields){return `<div class="card toolbar"><div class="row">${fields.map(f=>`<label>${f} <input placeholder="${f}"></label>`).join('')}<button class="btn primary" onclick="mockSearch()">查询</button><button class="btn" onclick="resetFields()">重置</button></div></div>`}
  function resetFields(){document.querySelectorAll('#view input').forEach(x=>{if(x.type!=='checkbox')x.value=''});state('data')}
  function mockSearch(){state('loading');setTimeout(()=>state('data'),450)}
  function table(headers,rows){return `<div class="card table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="meta">每页 20 条 · 当前显示 Mock 前 3 条 · 大结果集使用游标</p></div>`}
  function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}
  function dashboard(ops=false){const metrics=ops?['设备在线','今日入库','短信猫状态','异常设备']:['设备在线','近 7 日采集','当日/累计采集','布控告警','场所排行','去重数据','数据归属 Top10','电围分类','设备地图','操作统计','采集趋势','应用入口'];const values=ops?['128 / 140','12,480 条','在线','3 台']:['128 / 140','84,230 条','12,480 / 1,280 万','7 条','5 个场所','63,100 条','10 地区','2G / 4G / 5G','140 台','362 次','上升 8.2%','4 个入口'];return `<div class="grid">${metrics.map((m,i)=>`<div class="card"><div class="meta">${m}</div><div class="metric">${values[i]}</div><div class="meta">Mock 值 · 更新于 10:30 · ${i%4===0?'近实时':'日统计'}</div></div>`).join('')}</div><div class="split" style="margin-top:16px">${card('趋势与排行','<div class="chart">'+[45,80,55,92,64,72,85].map(x=>`<div class="bar" style="height:${x}%"></div>`).join('')+'</div>')}${card('操作入口','<div class="actions"><button class="btn" onclick="show(\'围栏检索\')">数据检索</button><button class="btn" onclick="show(\'地图研判\')">地图研判</button><button class="btn" onclick="show(\'综合布控\')">布控预警</button></div>')}</div>`}
  function searchPage(){const type=active.replace('检索','');return controls(['场所','采集开始','采集结束',type==='围栏'?'IMSI / IMEI':type==='车牌'?'车牌号':'MAC地址'])+`<div class="row toolbar"><button class="btn" onclick="message('已创建异步导出任务')">导出</button><button class="btn" onclick="show('数据运算')">加入数据集</button><span class="hint">勾选目标后，动作会保留 contextId</span></div>`+table(['选中','采集时间','类型','脱敏目标','场所','设备','操作'],Array.from({length:3},(_,i)=>[`<input type="checkbox">`,`2026-09-26 10:0${i}`,type,`目标 ****${i+1}`,'示例场所','设备 A-0'+i,`<button class="btn" onclick="chosen='目标 ****${i+1}';message('已选中 ${type} 目标')">详情</button>`]))+card('通用研判动作',`<div class="actions">${['统计','轨迹','伴随','检索','布控','位置追踪','区域统计'].map(a=>`<button class="btn" onclick="action('${a}')">${a}</button>`).join('')}</div><p class="hint">区域统计与加入数据集作用于当前查询快照，需要范围确认。</p>`)}
  function action(a){if(['轨迹','位置追踪'].includes(a))show('地图研判');else if(a==='伴随')show('伴随任务');else if(a==='布控')show('综合布控');else if(a==='区域统计')show('区域统计');else message('已创建服务端 AnalysisContext · '+a)}
  function mapPage(devices=false){return controls(devices?['场所','设备在线状态','关键词']:['目标','时间范围','数据类型'])+`<div class="row toolbar">${['单选','多选','框选','轨迹','热力图','图层','重置'].map(x=>`<button class="btn" onclick="message('地图操作：${x}')">${x}</button>`).join('')}</div><div class="split"><div class="map">${[[26,36],[48,60],[68,35],[75,72]].map(([x,y],i)=>`<button class="dot" style="left:${x}%;top:${y}%" onclick="this.classList.toggle('selected');message('已选择点位 ${i+1}')">${i+1}</button>`).join('')}</div>${card('点位与详情',`<p>已加载当前视窗的 Mock 点位。</p><p class="hint">缩放后重新请求；低 zoom 返回聚合，不加载全量。</p><div class="actions"><button class="btn" onclick="show('${devices?'设备管理':'伴随任务'}')">查看详情/任务</button></div>`)}</div>${devices?'':card('轨迹时间轴','<input type="range" style="width:100%"><p class="hint">时间升序；列表、轨迹和详情共用上下文。</p>')}`}
  function taskPage(){const kind=active.replace('任务','');return controls(['任务名称','分析日期范围'])+`<div class="row toolbar"><button class="btn primary" onclick="message('已打开 ${kind}新建表单：目标、范围、参数、预览、提交')">新建${kind}</button><span class="hint">结果保留参数快照与算法版本。</span></div>`+table(['任务名','类型','状态','进度','创建时间','操作'],[[kind+'示例 01',kind,'<span class="tag">成功</span>','100%','09-26 09:00','<button class="btn" onclick="message(\'详情：结果分页与导出\')">详情</button>'],[kind+'示例 02',kind,'<span class="tag warn">运行中</span>','46%','09-26 10:00','<button class="btn" onclick="message(\'已请求取消；待 Worker 确认\')">取消</button>']])}
  function message(t){alert(t+'\n\n这是交互原型，不会写入数据。')}
  function render(){const v=document.getElementById('view');let body=`<h1>${active}</h1>${demoStates()}`;if(mode!=='data'){v.innerHTML=body+stateBox();return}if(active==='系统首页'||active==='运维首页')body+=dashboard(active==='运维首页');else if(['围栏检索','车牌检索','MAC检索'].includes(active))body+=searchPage();else if(active==='人像检索')body+=controls(['场所','采集开始','采集结束'])+`<div class="row toolbar"><button class="btn primary" onclick="message('上传后创建搜图任务')">上传照片搜图</button><label>相似度阈值待确认 <input disabled value="待确认"></label></div><div class="gallery">${Array.from({length:8},(_,i)=>card('人像 '+(i+1),`<div class="portrait">◉</div><p>Mock 图像 · 质量待评估</p><button class="btn" onclick="message('同人搜索需确认算法阈值')">同人搜索</button>`)).join('')}</div>`;else if(['地图研判','设备分布'].includes(active))body+=mapPage(active==='设备分布');else if(['伴随任务','碰撞任务','区域统计','任务中心','运维报表','运维通知','参数配置'].includes(active))body+=taskPage();else if(active==='数据运算')body+=card('数据集运算',`<div class="row"><select><option>集合 A</option></select><select><option>交集</option><option>并集</option><option>差集</option></select><select><option>集合 B</option></select><button class="btn primary" onclick="message('已创建集合运算任务')">提交任务</button></div><p class="hint">显示输入集合、去重规则、预估数量和异步状态。</p>`)+table(['名称','类型','数量','来源','操作'],[['重点目标 A','IMSI','120','检索上下文','<button class="btn" onclick="message(\'打开数据集详情\')">详情</button>']]);else if(active==='综合布控')body+=taskPage()+card('实时命中与通知',`<p>运行中的命中流水与结束后的最终统计分开。</p><button class="btn" onclick="message('撤销会停止后续命中，但已发送通知保留')">撤销说明</button>`);else if(['人员库','图码档案','车码档案'].includes(active))body+=controls(['名称','分类'])+table(['档案','关联目标','证据','复核状态','操作'],[['Mock 档案 A','3','采集记录 12 条','待复核','<button class="btn" onclick="message(\'打开档案证据详情\')">详情</button>']]);else if(active==='设备管理')body+=controls(['场所','设备名称/序列号','状态','分类'])+table(['设备','场所','状态','最后心跳','操作'],[['设备 A-01','示例场所','<span class="tag">在线</span>','10:24','<button class="btn" onclick="message(\'参数/历史/复位需二次确认\')">详情</button>']]);else body+=controls(active.includes('日志')?['操作人/任务','时间范围']:['名称','编号'])+table(['名称/对象','类型','状态','更新时间','操作'],[['Mock 记录','示例','<span class="tag">正常</span>','09-26 10:00','<button class="btn" onclick="message(\'操作需后端权限与审计\')">详情</button>']]);v.innerHTML=body}
  </script>
</body>
</html>
