<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多维数据分析平台 系统设计交互原型</title>
  <link rel="icon" href="data:,">
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#162b3d;background:#f5f7fa;--blue:#1769aa;--line:#d9e1ea;--muted:#5e6d7c}
    *{box-sizing:border-box}body{margin:0}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eaf3fa,#f8fafc)}
    .login-card{width:min(420px,92vw);padding:32px;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #163b6020}
    h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0 0 10px}.hint{color:var(--muted);font-size:12px}.login-card label{display:block;margin-top:16px}
    input,select{height:38px;border:1px solid #b9c7d4;border-radius:6px;padding:0 10px;background:white;color:#162b3d;min-width:120px}
    input[type=checkbox]{height:auto;min-width:auto}.login-card input{width:100%;margin-top:6px}.shell{display:none;min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .body{display:flex;min-height:calc(100vh - 64px)}.side{width:224px;height:calc(100vh - 64px);position:sticky;top:0;overflow:auto;flex-shrink:0;background:#102f4c;padding:16px 8px;color:#eaf4ff}.side button{display:block;width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}.side button:hover,.side button.active{background:#245a87}
    main{padding:24px;flex:1;min-width:0;max-width:1660px}.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.metric{font-size:24px;font-weight:700;margin-top:8px}.meta{font-size:12px;color:var(--muted)}
    button{font:inherit}.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;color:#183b55}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.danger{color:#b42332}.toolbar{margin-bottom:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 10px;font-size:13px}th{background:#f3f7fa}.tag{border-radius:20px;padding:4px 9px;font-size:12px;background:#e4f4eb;color:#147d52}.tag.warn{background:#fff0d7;color:#9b5d00}.tag.fail{background:#fde8ea;color:#b42332}.map{height:420px;border:1px solid #bed1e0;border-radius:8px;background:linear-gradient(45deg,#e4f0e8 25%,transparent 25%),linear-gradient(-45deg,#e4f0e8 25%,transparent 25%),#d7e8e9;background-size:80px 80px;position:relative;overflow:hidden}.map::before{content:"地图示意 · Mock 点位 · 当前视窗查询";position:absolute;left:16px;top:16px;background:#ffffffd9;padding:8px;border-radius:5px;font-size:12px}.dot{position:absolute;border:0;border-radius:50%;background:#1769aa;color:white;width:30px;height:30px;cursor:pointer}.dot.selected{outline:4px solid #e8b14c}.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:16px}.chart{height:180px;background:repeating-linear-gradient(to right,#fff,#fff 39px,#eaf0f5 40px),repeating-linear-gradient(to top,transparent,transparent 39px,#eaf0f5 40px);border:1px solid var(--line);display:flex;align-items:end;padding:10px;gap:8px}.bar{flex:1;background:#5d9dcc;min-height:20px}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.portrait{height:150px;border-radius:6px;background:linear-gradient(135deg,#dce7ed,#b5cdda);display:grid;place-items:center;color:#456;font-size:36px}.notice{padding:10px 12px;border-radius:6px;background:#fff6e8;color:#8d5b08;font-size:13px}.empty{padding:46px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}.panel{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fafcfe}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{margin-top:24px;color:var(--muted);font-size:12px}.hide{display:none!important}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.side{width:180px}.gallery{grid-template-columns:repeat(2,1fr)}}
  </style>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <section id="login" class="login"><form class="login-card" onsubmit="event.preventDefault();enter()"><h1>多维数据分析平台</h1><p class="hint">交互原型 · 所有数据均为虚构Mock</p><label>登录账号<input id="account" aria-label="登录账号" autocomplete="username" required></label><label>密码<input id="password" type="password" aria-label="密码" autocomplete="current-password" required></label><p class="inline-error" id="login-error" role="alert"></p><p><button class="btn primary" type="submit">登录并查看原型</button></p><p class="hint">演示账号 demo.admin / demo.analyst / demo.secret / demo.test，密码均为 demo123。仅在本机保存Mock数据。</p></form></section>
  <section id="shell" class="shell"><header class="top"><strong>多维数据分析平台 <span class="hint">设计原型</span></strong><div class="row"><label class="hint">演示身份<select id="identity" aria-label="演示身份"></select></label><button class="btn" data-action="messages">消息 <span id="message-count">0</span></button><button class="btn" data-action="nav" data-args="任务中心">任务中心</button><button class="btn" data-action="logout">退出</button></div></header><div class="body"><aside class="side" id="side"></aside><main><div id="crumb" class="crumb"></div><div id="view"></div><div class="footer">本原型使用本地Mock数据、示意地图及模拟分析结果。数据会保存在当前浏览器中。</div></main></div></section>
  <div id="modal-host"></div><div id="context-host"></div><div id="toast" class="toast" hidden role="status"></div><input id="face-file" type="file" accept="image/*" hidden>
  <script src="vendor/jszip.min.js"></script><script src="app.js"></script>
</body>
</html>
